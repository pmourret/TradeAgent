[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradeagent"
version = "0.1.0"
description = "Agent de trading crypto piloté par IA, avec garde-fous en code et kill switch (paper trading d'abord)."
requires-python = ">=3.10"
dependencies = [
    "ccxt>=4.0",
    "pyyaml>=6.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tradeagent = "tradeagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tradeagent = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
