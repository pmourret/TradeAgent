# Configuration de l'agent de trading.
# Toute clé inconnue est refusée au démarrage : une faute de frappe ne doit
# jamais désactiver un garde-fou en silence.

mode: paper            # seul "paper" est implémenté pour l'instant
# Identifiant ccxt de l'exchange dont on lit les prix publics : aucune clé API nécessaire en paper.
# C'est celui visé pour le réel, afin que prix, paires et frais du paper lui ressemblent.
# Binance n'est plus utilisable par les résidents français depuis le 01/07/2026 (pas d'agrément MiCA).
exchange: bitvavo
quote_currency: EUR
symbols: [BTC/EUR, ETH/EUR]
stake: 50.0            # la mise de départ (fictive en paper) ; changer sans `reset` est refusé
cycle_seconds: 900     # une décision toutes les 15 minutes
database: data/agent.db

costs:
  # 0,25 % par ordre : frais taker du premier palier (volume 30 jours à partir de 0 €), marchés en EUR.
  # Le bot ne passe que des ordres au marché, donc il paie toujours le taker, jamais le maker.
  # Source : https://bitvavo.com/en/fees, relevé le 04/10/2026. À revoir si l'exchange ou sa grille change.
  fee_rate: 0.0025
  slippage_bps: 5      # 0,05 % de glissement par ordre

# Garde-fous : appliqués en code entre l'agent et l'exchange.
# L'agent ne peut ni les lire en écriture ni les contourner.
guardrails:
  max_order_pct: 20            # taille max d'un ordre, en % de l'equity
  max_position_pct: 40         # exposition max sur un seul symbole
  max_total_exposure_pct: 80   # exposition totale max (garde au moins 20 % en cash)
  min_order_quote: 5           # ordre minimum, en monnaie de cotation
  max_buys_per_day: 10         # les ventes ne sont jamais bloquées par ce plafond
  max_daily_loss_pct: 5        # au-delà : plus d'achat jusqu'au lendemain (UTC)
  max_price_age_s: 120         # prix plus vieux que ça : ordre refusé
  quantity_decimals: 6

# Kill switch : indépendant de l'agent, état conservé en base (un redémarrage ne ressuscite pas le bot).
killswitch:
  max_total_loss_pct: 50       # equity <= 50 % de la mise : mort
  max_drawdown_pct: 40         # -40 % depuis le plus haut : mort
  max_consecutive_errors: 10   # trop d'erreurs d'affilée : arrêt sans liquidation
  liquidate_on_death: true     # à la mort, tout est vendu au marché

# Paliers de risque : on réduit la voilure AVANT la mort, d'après le drawdown depuis le plus haut.
risk_tiers:
  cautious_drawdown_pct: 15    # au-delà : tailles d'ordre et plafonds multipliés par le facteur
  cautious_size_factor: 0.5
  defensive_drawdown_pct: 25   # au-delà : plus d'achat, ventes seulement (doit rester sous max_drawdown_pct)

# Données de marché fournies à l'agent
market:
  timeframe: 1h
  candles: 48

# Agent LLM et son « loyer » : chaque appel coûte de l'argent réel.
llm:
  provider: anthropic
  model: claude-haiku-4-5-20251001
  max_output_tokens: 400
  call_every_seconds: 3600         # au plus un appel par heure ; le kill switch, lui, tourne à chaque cycle
  price_input_per_mtok_usd: 1.0    # à vérifier sur la page de prix d'Anthropic
  price_output_per_mtok_usd: 5.0
  usd_to_eur: 0.90                 # approximatif et volontairement pessimiste ; à ajuster
  daily_budget_eur: 0.25           # plafond de dépense API par jour (UTC)
  total_budget_eur: 10.0           # plafond total du bot sur toute l'expérience, toutes vies confondues ;
                                   # les backtests avec le vrai LLM ont une enveloppe à part, du même montant
