# Le backend sur le serveur : un conteneur par bot, relancé tout seul (plantage, redémarrage du serveur).
# Argent fictif, prix publics, aucune clé : ces services n'ont besoin d'aucun secret.
#
#   docker compose build
#   docker compose up -d                 # démarre les bots
#   docker compose ps                    # « healthy » = un cycle récent, pas seulement un processus en vie
#   docker compose logs -f board
#   docker compose stop board            # arrêt comme Ctrl+C : verrou rendu, état gardé en base
#   docker compose run --rm board status --all
#   docker compose run --rm board reset --profile board --yes     # refusé tant que le bot tourne
#
# Les données (bases, verrous, cache d'historique) vivent sur le serveur, pas dans les conteneurs :
#   sudo mkdir -p /var/lib/docker/hiatus/tradeagent/data
#   sudo chown 1000:1000 /var/lib/docker/hiatus/tradeagent/data
#
# L'interface (service `web`) n'est atteinte que par Traefik, en HTTPS, et demande un compte :
#   sudo mkdir -p /var/lib/docker/hiatus/tradeagent/auth
#   sudo chown 1000:1000 /var/lib/docker/hiatus/tradeagent/auth
#   nano .env.web         # une ligne : TRADEAGENT_SETUP_CODE=un-code-que-tu-choisis   (12 caractères au moins)
#   chmod 600 .env.web
# À la première visite, la page demande ce code pour créer le compte administrateur (un seul, une seule fois).
# Ensuite le code ne sert plus : vide .env.web puis `docker compose up -d web`, qui recrée le conteneur sans lui.
# Ne mets rien d'autre dans .env.web : c'est le conteneur le plus exposé. Aucun port n'est publié sur le serveur,
# ni pour l'interface ni pour les bots ; l'interface n'est jointe que par le réseau Docker `proxy`.

x-bot: &bot
    build: .
    image: tradeagent:latest
    restart: unless-stopped
    init: true                  # un vrai PID 1, qui transmet les signaux au bot
    stop_signal: SIGINT         # l'équivalent de Ctrl+C, que `tradeagent run` sait recevoir (pas SIGTERM)
    stop_grace_period: 2m
    volumes:
        - /var/lib/docker/hiatus/tradeagent/data:/app/data
    networks:
        - backend
    logging:
        driver: json-file
        options:
            max-size: "10m"
            max-file: "5"

services:

    hold:
        <<: *bot
        container_name: tradeagent-hold
        command: ["run", "--profile", "hold"]
        healthcheck:
            test: ["CMD", "tradeagent", "health", "--profile", "hold"]
            interval: 5m
            timeout: 30s
            retries: 2
            start_period: 2m

    board:
        <<: *bot
        container_name: tradeagent-board
        command: ["run", "--profile", "board"]
        healthcheck:
            test: ["CMD", "tradeagent", "health", "--profile", "board"]
            interval: 5m
            timeout: 30s
            retries: 2
            start_period: 2m

    web:
        build: .
        image: tradeagent:latest
        container_name: tradeagent-web
        restart: unless-stopped
        init: true
        stop_signal: SIGINT
        command: ["serve", "--profiles", "hold,board", "--bind", "0.0.0.0"]
        env_file:
            - path: .env.web            # TRADEAGENT_SETUP_CODE, pour la création du compte seulement
              required: false
        mem_limit: 256m                 # l'interface ne doit jamais affamer les bots
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        environment:
            TRADEAGENT_PUBLIC_HOST: trade.sternum-lab.duckdns.org
            TRADEAGENT_AUTH_FILE: /app/auth/auth.json
        volumes:
            # Les bases des bots en LECTURE SEULE : même une faille de l'interface ne pourrait pas les modifier.
            - /var/lib/docker/hiatus/tradeagent/data:/app/data:ro
            # Le compte (empreinte du mot de passe, clé des sessions) : seul dossier où l'interface écrit.
            - /var/lib/docker/hiatus/tradeagent/auth:/app/auth
        healthcheck:
            test: ["CMD", "python", "-c", "import os,urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8080/healthz', headers={'Host': os.environ['TRADEAGENT_PUBLIC_HOST']}), timeout=5)"]
            interval: 1m
            timeout: 10s
            retries: 3
        networks:
            - proxy
        labels:
            - traefik.enable=true
            - traefik.docker.network=proxy
            - traefik.http.routers.tradeagent.rule=Host(`trade.sternum-lab.duckdns.org`)
            - traefik.http.routers.tradeagent.entrypoints=websecure
            - traefik.http.routers.tradeagent.tls.certresolver=duckdns
            - traefik.http.services.tradeagent.loadbalancer.server.port=8080
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "5"

networks:
    proxy:
        external: true
    backend:
        external: true
